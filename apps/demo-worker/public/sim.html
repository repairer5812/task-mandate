<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>음성 위임 시뮬레이션</title>
<meta name="description" content="사람이 말로 맡기면 위임장이 발급되고 에이전트가 3D 모의 민원실 창구에서 검증받는 시뮬레이션 화면입니다. 실제 민원은 접수되지 않습니다.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#8b1538">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="mask-icon" href="/favicon.svg" color="#8b1538">
<link rel="stylesheet" href="/sim/sim.css">
<script type="importmap">
{
  "imports": {
    "three": "/vendor/three.module.min.js"
  }
}
</script>
</head>
<body>
<header class="bar">
  <h1>모의 민원 창구, 위임 시뮬레이션</h1>
  <span class="mock">모의</span>
  <div class="bar-right">
    <a class="bar-link" href="/civil">모의 민원 창구</a>
    <span class="clock" id="clock" role="timer" aria-label="지금 시각">00:00:00</span>
  </div>
</header>

<main class="sim-main">
  <div class="stage-wrap" id="stage-wrap">
    <div class="stage-canvas" id="stage-canvas" aria-hidden="true"></div>
    <div class="stage-2d" id="stage-2d" hidden></div>
    <div class="bubble-layer" id="bubble-layer" aria-live="polite"></div>

    <section class="phone-panel" id="phone-panel" aria-label="음성 위임 조작 패널">
      <div class="phone-screen">
        <div class="phone-header">
          <span class="phone-tag">본인 휴대폰 (모의)</span>
        </div>

        <p class="phone-say" id="spoken-text">"기초연금 신청해 줘"</p>

        <div class="mic-row">
          <button type="button" class="mic-btn" id="mic-btn" aria-label="마이크로 말하기">말하기</button>
          <p class="mic-status" id="mic-status">마이크를 누르거나 아래 예문 단추를 선택하세요.</p>
        </div>

        <div class="examples-box">
          <span class="examples-label">예문 단추</span>
          <div class="example-list" id="example-list"></div>
        </div>

        <form class="text-form" id="text-form">
          <input
            type="text"
            class="text-input"
            id="text-input"
            maxlength="200"
            placeholder="직접 입력 (예: 기초연금 신청해 줘)"
            aria-label="시킬 일 입력"
          >
          <button type="submit" class="text-submit-btn">해석</button>
        </form>

        <div class="interpret-card" id="interpret-card" hidden>
          <span class="card-heading">이렇게 알아들었습니다</span>
          <strong class="card-title" id="card-title"></strong>
          <span class="card-meta" id="card-meta"></span>
          <span class="card-source" id="card-source"></span>
          <button type="button" class="retry-say-btn" id="retry-say-btn" hidden>다시 말하기</button>
        </div>

        <div class="delegate-box" id="delegate-box" hidden>
          <p class="attest-notice"><strong class="attest-title">모의 본인 확인 안내</strong>실제 서비스에서는 공동인증서나 모바일 신분증이 이 자리에 들어갑니다</p>
          <button type="button" class="delegate-btn" id="delegate-btn">맡기기</button>
        </div>
      </div>
    </section>

    <section class="result-panel" id="result-panel" aria-label="접수증과 거절 시험" hidden>
      <div class="tests-box">
        <div class="tests-header">
          <span class="tests-title">거절 시험 단추 (4~7단계 다시 실행)</span>
          <button type="button" class="restart-btn" id="restart-btn">처음부터</button>
        </div>
        <div class="reject-buttons" id="reject-buttons"></div>
      </div>
      <ol class="feed" id="slip-list" aria-live="polite"></ol>
    </section>
  </div>

  <section class="steps-section" aria-label="진행 단계">
    <ol class="steps-bar" id="steps-bar"></ol>
    <div class="bottom-row">
      <p class="subtitle" id="subtitle" role="status" aria-live="polite"></p>
      <p class="sign">고려대학교 SW AI 융합정보대학원, (주) 알파코 최경찬</p>
    </div>
  </section>
</main>

<script type="module" src="/sim/app.js"></script>
</body>
</html>
