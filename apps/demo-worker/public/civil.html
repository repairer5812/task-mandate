<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모의 민원 창구</title>
<meta name="description" content="AI 에이전트의 과업 위임장을 실시간으로 확인하는 모의 민원 시연 화면입니다. 실제 민원은 접수되지 않습니다.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#8b1538">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="mask-icon" href="/favicon.svg" color="#8b1538">
<style>
:root{
  --crimson:#8b1538;--crimson-deep:#6e0f2b;
  --green:#1d6b3a;
  --ink:#1a1a1a;--ink-2:#454240;--ground:#f1f0ee;--paper:#ffffff;--rule:#d9d6d2;
  --font:"Pretendard","Pretendard Variable","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"DejaVu Sans Mono","Noto Sans Mono","Menlo","Consolas",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{word-break:keep-all;background:var(--ground);color:var(--ink);font-family:var(--font);-webkit-text-size-adjust:100%}
body{min-height:100vh;display:flex;flex-direction:column}
::selection{background:var(--crimson);color:#fff}
:focus-visible{outline:3px solid var(--crimson);outline-offset:3px}
.bar{background:var(--crimson);color:#fff;display:flex;align-items:center;gap:20px;padding:0 clamp(16px, 3.4vw, 64px);min-height:clamp(64px, 6vw, 112px)}
.bar h1{font-size:clamp(26px, 2.4vw, 46px);font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.mock{font-size:clamp(15px, 1.05vw, 20px);font-weight:700;border:2px solid #fff;border-radius:6px;padding:3px 10px;white-space:nowrap}
.clock{margin-left:auto;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:clamp(20px, 1.6vw, 30px)}
.lead{font-size:clamp(17px, 1.25vw, 24px);color:var(--ink-2);padding:clamp(14px, 1.2vw, 24px) clamp(16px, 3.4vw, 64px) 0;line-height:1.5}
.conn{margin:12px clamp(16px, 3.4vw, 64px) 0;background:var(--paper);border:1px solid var(--crimson);color:var(--crimson-deep);font-size:20px;font-weight:700;padding:10px 16px}
main{flex:1;display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);grid-template-rows:auto 1fr;align-items:start;gap:clamp(20px, 2.5vw, 48px);padding:clamp(16px, 1.5vw, 28px) clamp(16px, 3.4vw, 64px) 40px}
h2{font-size:clamp(17px, 1.15vw, 22px);font-weight:700;color:var(--ink-2);margin-bottom:12px}
.services{list-style:none}
.service-item{background:var(--paper);border:1px solid var(--rule);margin-bottom:-1px;padding:clamp(14px, 1.15vw, 22px) 22px}
.service-title{font-size:clamp(19px, 1.45vw, 28px);font-weight:700}
.feed{list-style:none;display:flex;flex-direction:column;gap:12px}
.slip{background:var(--paper);border:1px solid var(--rule);display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;align-items:center;gap:clamp(14px, 1.6vw, 32px);padding:clamp(10px, .75vw, 14px) clamp(16px, 1.5vw, 28px);min-height:clamp(80px, 5.4vw, 104px)}
.slip.is-latest{outline:4px solid var(--crimson);outline-offset:-4px}
.slip-no{display:flex;flex-direction:column;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:clamp(17px, 1.35vw, 26px);font-weight:700;color:var(--ink);padding-right:clamp(14px, 1.6vw, 32px);border-right:2px dashed var(--rule);line-height:1.15}
.slip-no small{font-family:var(--font);font-size:clamp(12px, .8vw, 15px);font-weight:600;color:var(--ink-2)}
.slip-time{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:clamp(17px, 1.35vw, 26px);color:var(--ink-2)}
.slip-body{display:flex;flex-direction:column;gap:2px;min-width:0;line-height:1.2}
.slip-service{font-size:clamp(20px, 1.6vw, 30px);font-weight:700;overflow-wrap:anywhere}
.slip-reason{font-size:clamp(18px, 1.4vw, 27px);font-weight:600;overflow-wrap:anywhere}
.is-deny .slip-reason{color:var(--crimson)}
.is-pass .slip-reason{color:var(--green)}
.stamp{font-size:clamp(20px, 1.6vw, 30px);font-weight:900;letter-spacing:.12em;padding:.22em .55em .22em .67em;border:4px solid currentColor;border-radius:50% / 42%;transform:rotate(-6deg);white-space:nowrap}
.is-deny .stamp{color:var(--crimson)}
.is-pass .stamp{color:var(--green);border-style:double;border-width:6px}
.empty-state{background:var(--paper);border:1px dashed var(--rule);padding:28px;font-size:clamp(18px, 1.3vw, 24px);color:var(--ink-2);list-style:none}
.feed-col{grid-column:2;grid-row:1 / span 2}
.sign{grid-column:1;grid-row:2;align-self:start;font-size:clamp(14px, .95vw, 18px);color:var(--ink-2);line-height:1.5}
@media (prefers-reduced-motion:no-preference){
  .slip.is-new{animation:drop .5s cubic-bezier(.16,1,.3,1) both}
  .slip.is-new .stamp{animation:press .45s .25s cubic-bezier(.16,1,.3,1) both}
}
@keyframes drop{from{transform:translateY(-18px);opacity:.2}to{transform:none;opacity:1}}
@keyframes press{from{transform:rotate(-6deg) scale(1.6);opacity:0}to{transform:rotate(-6deg) scale(1);opacity:1}}
@media (max-width:820px){
  main{grid-template-columns:1fr}
  .slip{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"no time stamp" "body body stamp";column-gap:14px;row-gap:6px}
  .slip-no{grid-area:no;flex-direction:row;gap:10px;align-items:baseline;border-right:0;padding-right:0}
  .slip-time{grid-area:time;font-size:17px}
  .slip-body{grid-area:body}.stamp{grid-area:stamp}
  .feed-col,.sign{grid-column:auto;grid-row:auto}
}

</style>
</head>
<body>
<header class="bar"><h1>모의 민원 창구</h1><span class="mock">모의</span><span class="clock" id="clock" role="timer" aria-label="지금 시각">00:00:00</span></header>
<p class="lead">AI 에이전트가 위임장을 들고 오면 이 사이트가 확인합니다. 실제 민원은 접수되지 않습니다.</p>
<p class="conn" id="conn-banner" role="status" hidden>연결을 기다리는 중</p>
<main>
<section aria-labelledby="h-services"><h2 id="h-services">민원 목록</h2><ul class="services" id="service-list"></ul></section>
<section class="feed-col" aria-labelledby="h-feed"><h2 id="h-feed">접수증</h2><ol class="feed" id="log-list" aria-live="polite"></ol></section>
<p class="sign">고려대학교 SW AI 융합정보대학원, (주) 알파코 최경찬</p>
</main>
<script>
(() => {
  "use strict";

  const REASON_MAP = new Map([
    ["NO_MANDATE", "위임장이 없습니다"],
    ["TASK_NOT_ALLOWED", "맡긴 일이 아닙니다"],
    ["LIMIT_EXCEEDED", "맡긴 횟수를 다 썼습니다"],
    ["KEY_MISMATCH", "위임받은 에이전트가 아닙니다"],
    ["EXPIRED", "위임 기간이 끝났습니다"],
    ["SUPERSEDED", "같은 사람이 다른 에이전트에게 다시 맡겼습니다"],
    ["PERSON_REQUIRED", "본인 확인이 없습니다"],
    ["too-large", "요청이 너무 큽니다"],
    ["bad-request", "요청 형식이 잘못되었습니다"],
    ["not-found", "신청할 수 있는 민원이 아닙니다"],
    ["rate-limited", "요청이 너무 잦습니다"]
  ]);

  const MOCK_SERVICES = [
    { id: "basic-pension", title: "기초연금 신청(모의)" },
    { id: "resident-copy", title: "주민등록표 등본 발급(모의)" },
    { id: "disability-taxi", title: "장애인 콜택시 이용 등록(모의)" }
  ];

  const MOCK_ENTRIES = [
    { at: "2026-12-18T05:10:15.000Z", status: 403, code: "EXPIRED", service: "disability-taxi", task: null },
    { at: "2026-12-18T05:10:12.000Z", status: 403, code: "KEY_MISMATCH", service: "basic-pension", task: null },
    { at: "2026-12-18T05:10:09.000Z", status: 403, code: "LIMIT_EXCEEDED", service: "basic-pension", task: null },
    { at: "2026-12-18T05:10:06.000Z", status: 403, code: "TASK_NOT_ALLOWED", service: "resident-copy", task: "apply:basic-pension" },
    { at: "2026-12-18T05:10:03.000Z", status: 200, code: null, service: "basic-pension", task: "apply:basic-pension" },
    { at: "2026-12-18T05:10:00.000Z", status: 401, code: "NO_MANDATE", service: "basic-pension", task: null },
    { at: "2026-12-18T05:09:50.000Z", status: 404, code: "not-found", service: "unknown-service", task: null }
  ];

  const connBanner = document.getElementById("conn-banner");
  const serviceListEl = document.getElementById("service-list");
  const logListEl = document.getElementById("log-list");
  const serviceTitles = new Map();
  const seenKeys = new Set();
  let servicesLoaded = false;
  let initialLogLoaded = false;
  let lastEntries = [];
  let lastSignature = "";
  let pollBusy = false;

  const timeFormatter = new Intl.DateTimeFormat("ko-KR", {
    timeZone: "Asia/Seoul",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hourCycle: "h23"
  });

  function formatSeoulTime(iso) {
    if (typeof iso !== "string") return "00:00:00";
    const date = new Date(iso);
    if (Number.isNaN(date.getTime())) return iso;
    const parts = timeFormatter.formatToParts(date);
    let h = "00", m = "00", s = "00";
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      if (p.type === "hour") h = p.value;
      else if (p.type === "minute") m = p.value;
      else if (p.type === "second") s = p.value;
    }
    return h + ":" + m + ":" + s;
  }

  function resolveServiceTitle(serviceId) {
    if (typeof serviceId !== "string" || serviceId.length === 0) return "알 수 없음";
    return serviceTitles.get(serviceId) || "목록에 없는 민원";
  }

  function resolveReason(entry) {
    if (entry && entry.status === 200) return "접수되었습니다";
    const code = entry && typeof entry.code === "string" ? entry.code : "";
    if (!code) return "요청이 거절되었습니다";
    return REASON_MAP.get(code) || code;
  }

  function renderServices(services) {
    serviceTitles.clear();
    const items = [];
    for (let i = 0; i < services.length; i++) {
      const svc = services[i];
      if (!svc || typeof svc.id !== "string") continue;
      const title = typeof svc.title === "string" && svc.title.length > 0 ? svc.title : svc.id;
      serviceTitles.set(svc.id, title);

      const li = document.createElement("li");
      li.className = "service-item";
      const titleSpan = document.createElement("span");
      titleSpan.className = "service-title";
      titleSpan.textContent = title;
      li.append(titleSpan);
      items.push(li);
    }

    if (items.length === 0) {
      const empty = document.createElement("li");
      empty.className = "empty-state";
      empty.textContent = "등록된 민원이 없습니다.";
      serviceListEl.replaceChildren(empty);
    } else {
      serviceListEl.replaceChildren.apply(serviceListEl, items);
    }

    if (initialLogLoaded) {
      lastSignature = "";
      renderLog(lastEntries, false);
    }
  }

  function computeEntryKeys(entries) {
    const counts = new Map();
    const keys = new Array(entries.length);
    for (let i = entries.length - 1; i >= 0; i--) {
      const e = entries[i] || {};
      const base = [e.at ?? "", e.status ?? "", e.code ?? "", e.service ?? "", e.task ?? ""].join("|");
      const nextCount = (counts.get(base) || 0) + 1;
      counts.set(base, nextCount);
      keys[i] = base + "#" + nextCount;
    }
    return keys;
  }

  function renderLog(entries, allowHighlight) {
    lastEntries = entries;
    const keys = computeEntryKeys(entries);
    const sig = keys.join("\n");
    if (initialLogLoaded && sig === lastSignature) return;
    lastSignature = sig;

    if (entries.length === 0) {
      const empty = document.createElement("li");
      empty.className = "empty-state";
      empty.textContent = "아직 들어온 요청이 없습니다. 에이전트가 신청하면 여기에 접수증이 쌓입니다.";
      logListEl.replaceChildren(empty);
      initialLogLoaded = true;
      return;
    }

    const nodes = [];
    for (let i = 0; i < entries.length; i++) {
      const entry = entries[i] || {};
      const key = keys[i];
      const isNew = allowHighlight && initialLogLoaded && !seenKeys.has(key);
      seenKeys.add(key);

      const isPass = entry.status === 200;
      const li = document.createElement("li");
      li.className = "slip " + (isPass ? "is-pass" : "is-deny") + (i === 0 ? " is-latest" : "") + (isNew ? " is-new" : "");

      const noEl = document.createElement("span");
      noEl.className = "slip-no";
      const noLabel = document.createElement("small");
      noLabel.textContent = "접수번호";
      noEl.append(noLabel, String(entries.length - i).padStart(4, "0"));

      const timeEl = document.createElement("span");
      timeEl.className = "slip-time";
      timeEl.textContent = formatSeoulTime(entry.at);

      const body = document.createElement("div");
      body.className = "slip-body";
      const serviceEl = document.createElement("span");
      serviceEl.className = "slip-service";
      serviceEl.textContent = resolveServiceTitle(entry.service);
      const reasonEl = document.createElement("span");
      reasonEl.className = "slip-reason";
      reasonEl.textContent = resolveReason(entry);
      body.append(serviceEl, reasonEl);

      const stampEl = document.createElement("span");
      stampEl.className = "stamp";
      stampEl.textContent = isPass ? "접수" : "반려";

      li.append(noEl, timeEl, body, stampEl);
      nodes.push(li);
    }

    logListEl.replaceChildren.apply(logListEl, nodes);
    initialLogLoaded = true;
  }

  function setOffline(offline) {
    connBanner.hidden = !offline;
  }

  async function loadServices() {
    const res = await fetch("/civil/services", { cache: "no-store", signal: AbortSignal.timeout(4000) });
    if (!res.ok) throw new Error("services status " + res.status);
    const data = await res.json();
    if (!data || !Array.isArray(data.services)) throw new Error("invalid services");
    renderServices(data.services);
    servicesLoaded = true;
  }

  async function loadLog() {
    const res = await fetch("/civil/log", { cache: "no-store", signal: AbortSignal.timeout(4000) });
    if (!res.ok) throw new Error("log status " + res.status);
    const data = await res.json();
    if (!data || !Array.isArray(data.entries)) throw new Error("invalid log");
    renderLog(data.entries, true);
  }

  async function poll() {
    if (pollBusy) return;
    pollBusy = true;
    try {
      const tasks = [loadLog()];
      if (!servicesLoaded) tasks.unshift(loadServices());
      const results = await Promise.allSettled(tasks);
      let failed = false;
      for (let i = 0; i < results.length; i++) {
        if (results[i].status === "rejected") failed = true;
      }
      setOffline(failed);
    } catch (_err) {
      setOffline(true);
    } finally {
      pollBusy = false;
    }
  }

  const clockEl = document.getElementById("clock");
  function tick() { clockEl.textContent = formatSeoulTime(new Date().toISOString()); }
  tick();
  window.setInterval(tick, 1000);

  const params = new URLSearchParams(window.location.search);
  if (params.get("mock") === "1") {
    renderServices(MOCK_SERVICES);
    servicesLoaded = true;
    renderLog(MOCK_ENTRIES, false);
    setOffline(false);
  } else {
    poll();
    window.setInterval(poll, 2000);
  }
})();
</script>
</body>
</html>
